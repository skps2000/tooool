<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI/UX Style Reference Links 2026</title><meta name="description" content="40개 UI UX 디자인 스타일의 실제 사례와 공식 가이드 링크 모음"><style>:root{--b:#0c0d10;--c:#15171c;--l:#2a2d35;--t:#f6f7fa;--m:#9ca3af;--a:#ff6b35}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.w{width:min(1180px,calc(100% - 32px));margin:auto}header{padding:82px 0 44px}h1{font-size:clamp(45px,8vw,92px);line-height:.92;letter-spacing:-.07em;margin:0 0 24px}header p{max-width:760px;color:var(--m);font-size:18px;line-height:1.75}.n{padding:17px 19px;border:1px solid #51301e;background:#20140f;border-radius:16px;color:#f1c2aa;margin-top:26px}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding-bottom:80px}article{position:relative;background:var(--c);border:1px solid var(--l);border-radius:22px;padding:25px}.num{position:absolute;right:18px;top:17px;color:var(--m);font-size:12px}h2{font-size:29px;letter-spacing:-.04em;margin:0 0 8px}article p{color:var(--m);font-size:14px}.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:19px}a{text-decoration:none;color:#fff;border:1px solid var(--l);padding:9px 12px;border-radius:999px;font-size:13px;background:#0d0f13}a:hover{border-color:var(--a);color:#ffd5c4}footer{border-top:1px solid var(--l);padding:34px 0;color:var(--m);font-size:13px}@media(max-width:760px){.g{grid-template-columns:1fr}header{padding-top:54px}}</style></head><body><header><div class="w"><h1>UI/UX Style<br>Reference Links</h1><p>자체 제작 시안 없이 실제 디자이너 프로젝트, 공식 디자인 시스템, 공개 갤러리와 검색 결과만 연결한 참고 링크 모음입니다.</p><div class="n">외부 사이트 이미지는 복제하지 않고 원본 페이지로 연결합니다. Dribbble·Behance·Figma·Pinterest 일부 결과는 서비스 정책에 따라 로그인을 요구할 수 있습니다.</div></div></header><main class="w"><div id="g" class="g"></div></main><footer><div class="w">40 Design Styles · External references only · XTI Corp</div></footer><script>const s=['Glassmorphism','Liquid Glass','Neumorphism','Claymorphism','Skeuomorphism','Flat Design','Material Design','Material 3 Expressive','Minimalism','Neo Minimalism','Brutalism','Neo Brutalism','Swiss Style','Bauhaus','Editorial Design','Bento UI','Aurora Gradient','Mesh Gradient','Organic Design','Blob Design','Y2K','Cyberpunk','Dark Luxury','Luxury Minimalism','Apple Design','Microsoft Fluent 2','visionOS Spatial UI','AI SaaS Style','Dashboard Style','Data Visualization Style','Finance UI','Health UI','Fitness UI','Travel UI','Social Media UI','Gaming UI','E-commerce UI','Magazine Style','Monochrome','Pastel Design'];const o={'Liquid Glass':'https://developer.apple.com/documentation/TechnologyOverviews/liquid-glass','Material Design':'https://m3.material.io/','Material 3 Expressive':'https://m3.material.io/','Apple Design':'https://developer.apple.com/design/human-interface-guidelines/','Microsoft Fluent 2':'https://fluent2.microsoft.design/','visionOS Spatial UI':'https://developer.apple.com/design/human-interface-guidelines/designing-for-visionos','Data Visualization Style':'https://observablehq.com/','Health UI':'https://developer.apple.com/health-fitness/','Fitness UI':'https://www.nike.com/nrc-app','E-commerce UI':'https://polaris.shopify.com/','Gaming UI':'https://www.gameuidatabase.com/'};const e=x=>encodeURIComponent(x),slug=x=>x.toLowerCase().replaceAll(' ','-');document.querySelector('#g').innerHTML=s.map((x,i)=>{const L=[];if(o[x])L.push(['Official / Reference',o[x]]);L.push(['Dribbble','https://dribbble.com/search/'+e(slug(x))],['Behance','https://www.behance.net/search/projects?search='+e(x+' UI')],['Figma Community','https://www.figma.com/community/search?query='+e(x)],['Pinterest','https://www.pinterest.com/search/pins/?q='+e(x+' UI')],['Google Images','https://www.google.com/search?tbm=isch&q='+e(x+' UI design')]);return `<article><div class=num>${String(i+1).padStart(2,'0')}</div><h2>${x}</h2><p>실제 사례 이미지와 프로젝트를 외부 원본에서 확인합니다.</p><div class=links>${L.map(v=>`<a href="${v[1]}" target=_blank rel=noopener>${v[0]} ↗</a>`).join('')}</div></article>`}).join('');</script></body></html>
