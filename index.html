<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI/UX Design Style Atlas 2026</title><meta name="description" content="40개 UI/UX 디자인 스타일, 실제 사례, 대표 앱, 적용 분야, 장단점과 레퍼런스 링크"><style>:root{--b:#0b0c0f;--p:#15171c;--l:#2b2e36;--t:#f5f6f8;--m:#9da4b1;--a:#ff6b35}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px/1.6 Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{width:min(1200px,calc(100% - 32px));margin:auto}header{padding:80px 0 38px;background:radial-gradient(circle at 80% 10%,#ff6b3525,transparent 26%)}h1{font-size:clamp(46px,8vw,96px);line-height:.9;letter-spacing:-.07em;margin:0 0 24px}header p{max-width:800px;color:#c2c7d0;font-size:18px}.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--m);font-size:13px}.bar{position:sticky;top:0;z-index:9;background:#0b0c0fe8;backdrop-filter:blur(16px);border-bottom:1px solid var(--l);padding:14px 0}.bar input{width:100%;border:1px solid var(--l);background:#121419;color:#fff;border-radius:14px;padding:15px 18px;font-size:15px;outline:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:36px 0 80px}.card{background:var(--p);border:1px solid var(--l);border-radius:22px;padding:24px}.top{display:flex;justify-content:space-between;gap:12px}.top small{color:var(--a);font-weight:800}.top h2{font-size:29px;letter-spacing:-.04em;margin:5px 0}.toggle{width:38px;height:38px;border-radius:50%;border:1px solid var(--l);background:#0d0f13;color:#fff;font-size:22px;cursor:pointer}.open .toggle{transform:rotate(45deg)}.desc{color:#c6cbd4}.tags{display:flex;gap:7px;flex-wrap:wrap}.tags span{font-size:11px;color:#cdd3dc;background:#0e1014;border:1px solid var(--l);border-radius:999px;padding:6px 9px}.detail{display:none;margin-top:20px;padding-top:20px;border-top:1px solid var(--l)}.open .detail{display:block}.box,.cols>div{background:#0f1116;border:1px solid #242832;border-radius:15px;padding:15px}.box b,.cols b{font-size:12px;color:var(--a)}.box p,.cols p{margin:7px 0 0;color:#bbc1cc;font-size:14px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.links a{text-decoration:none;color:#fff;font-size:12px;border:1px solid var(--l);border-radius:999px;padding:8px 11px;background:#0c0e12}.links a:hover{border-color:var(--a)}footer{border-top:1px solid var(--l);padding:34px 0;color:var(--m);font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}.cols{grid-template-columns:1fr}header{padding-top:58px}}</style></head><body><header><div class="w"><h1>UI/UX Design<br>Style Atlas</h1><p>40개 디자인 스타일을 실제 사례와 대표 앱, 적합 분야, 장점·단점, 공식 문서와 공개 레퍼런스 링크 중심으로 정리한 실무 참고서입니다.</p><div class="meta"><span>40 styles</span><span>Real-world examples</span><span>Apps & industries</span><span>External references</span></div></div></header><div class="bar"><div class="w"><input id="q" placeholder="스타일, 앱, 분야 검색 — 예: Fitness, Apple, 금융"></div></div><main class="w"><div id="g" class="grid"></div></main><footer><div class="w">UI/UX Design Style Atlas 2026 · XTI Corp · 외부 원본 링크 중심</div></footer><script>const D=[["Glassmorphism","글래스모피즘","반투명 표면과 배경 블러로 계층과 깊이를 만드는 시각 스타일.","Apple Music·macOS 패널·금융 대시보드의 오버레이","미디어, 금융, 대시보드, 프리미엄 앱","고급감과 깊이 표현","대비가 낮아지기 쉽고 성능 비용이 있다",""],["Liquid Glass","리퀴드 글래스","빛의 굴절·반사·유동성을 반영하는 Apple 중심의 동적 소재 언어.","Apple의 최신 플랫폼 UI와 시스템 컨트롤","iOS, macOS, visionOS, 미디어","플랫폼 일관성과 생동감","콘텐츠보다 효과가 앞서면 가독성이 무너진다","https://developer.apple.com/documentation/TechnologyOverviews/liquid-glass"],["Neumorphism","뉴모피즘","밝고 어두운 이중 그림자로 요소가 배경에서 솟거나 눌린 것처럼 보이게 한다.","계산기, 음악 컨트롤러, 스마트홈 콘셉트 앱","간단한 도구, 컨트롤 패널","촉각적이고 부드러운 인상","상태 구분과 접근성이 약하다",""],["Claymorphism","클레이모피즘","말랑한 점토 같은 3D 볼륨과 둥근 형태를 사용하는 친근한 스타일.","교육 앱, 웰니스 앱, 캐주얼 게임 UI","교육, 키즈, 웰니스, 게임","친근하고 기억하기 쉽다","진지한 업무·금융 서비스에는 유치해질 수 있다",""],["Skeuomorphism","스큐어모피즘","현실 물체와 재질을 디지털 화면에 직접 모사한다."
