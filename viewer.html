<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI/UX Design Style Atlas · Split Viewer</title><meta name="description" content="UI/UX 디자인 스타일 카드와 실제 레퍼런스를 한 화면에서 보는 2분할 뷰어"><style>:root{--bg:#090a0d;--panel:#111318;--line:#292d36;--text:#f5f6f8;--muted:#9da4b1;--accent:#ff6b35}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100%;display:grid;grid-template-rows:58px 1fr}.topbar{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#0d0f13}.brand{font-weight:800;letter-spacing:-.03em;white-space:nowrap}.status{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.topbar button,.topbar a{border:1px solid var(--line);background:#14171d;color:#fff;border-radius:10px;padding:8px 11px;font-size:12px;text-decoration:none;cursor:pointer}.topbar button:hover,.topbar a:hover{border-color:var(--accent)}.workspace{display:grid;grid-template-columns:minmax(520px,54%) minmax(420px,46%);min-height:0}.panel{min-width:0;min-height:0;position:relative}.panel.left{border-right:1px solid var(--line)}iframe{width:100%;height:100%;border:0;background:#fff}.preview-empty,.preview-help{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:40px;background:var(--panel);color:var(--muted);z-index:2}.preview-empty strong{display:block;color:#fff;font-size:22px;margin-bottom:10px}.preview-help{display:none;z-index:3}.preview-help .box{max-width:420px}.preview-help b{display:block;color:#fff;font-size:18px;margin-bottom:9px}.preview-help a{display:inline-block;margin-top:16px;padding:10px 14px;background:var(--accent);color:#fff;text-decoration:none;border-radius:10px}.tabs{position:absolute;left:12px;right:12px;top:12px;z-index:4;display:none;gap:7px;overflow:auto;padding:8px;background:#101217e8;backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#0c0e12;color:#d0d5df;border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer}.tabs button.active{border-color:var(--accent);color:#fff;background:#2b1710}.mobile-switch{display:none}.loader{position:absolute;right:18px;bottom:18px;z-index:5;padding:8px 11px;border-radius:999px;background:#000b;color:#fff;font-size:12px;display:none}@media(max-width:900px){.workspace{display:block}.panel{position:absolute;inset:58px 0 0}.panel.right{transform:translateX(100%);transition:.25s ease;z-index:10}.panel.right.show{transform:translateX(0)}.panel.left{border:0}.mobile-switch{display:inline-block}.brand{font-size:13px}.status{display:none}}</style></head><body><div class="app"><header class="topbar"><div class="brand">DESIGN ATLAS · SPLIT VIEW</div><div id="status" class="status">왼쪽 카드의 레퍼런스 링크를 선택하면 오른쪽에 표시됩니다.</div><button id="backBtn" class="mobile-switch">카드 보기</button><button id="reloadBtn">새로고침</button><a id="openBtn" href="./index.html" target="_blank" rel="noopener">원본 열기 ↗</a></header><main class="workspace"><section class="panel left"><iframe id="atlas" src="./index.html" title="디자인 스타일 카드"></iframe></section><section id="rightPanel" class="panel right"><div id="tabs" class="tabs"></div><div id="empty" class="preview-empty"><div><strong>한 화면 레퍼런스 뷰어</strong>왼쪽에서 디자인 카드를 펼친 뒤<br>Dribbble, Behance, Figma, Pinterest 또는 공식 링크를 누르세요.</div></div><iframe id="preview" title="외부 레퍼런스 미리보기" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe><div id="help" class="preview-help"><div class="box"><b>외부 사이트가 프레임 표시를 차단했습니다.</b>Dribbble, Behance, Figma, Pinterest 등은 보안 정책에 따라 iframe 안에서 열리지 않을 수 있습니다.<br><a id="helpOpen" href="#" target="_blank" rel="noopener">원본 페이지 열기 ↗</a></div></div><div id="loader" class="loader">불러오는 중…</div></section></main></div><script>const atlas=document.getElementById('atlas'),preview=document.getElementById('preview'),empty=document.getElementById('empty'),help=document.getElementById('help'),helpOpen=document.getElementById('helpOpen'),openBtn=document.getElementById('openBtn'),status=document.getElementById('status'),tabs=document.getElementById('tabs'),right=document.getElementById('rightPanel'),loader=document.getElementById('loader');let current='./index.html',timer=null;function label(a){return(a.textContent||'Reference').replace(/↗/g,'').trim()}function loadRef(a){const href=a.href;current=href;empty.style.display='none';help.style.display='none';loader.style.display='block';preview.src='about:blank';openBtn.href=href;helpOpen.href=href;status.textContent=label(a)+' · '+href;right.classList.add('show');clearTimeout(timer);setTimeout(()=>preview.src=href,40);timer=setTimeout(()=>{loader.style.display='none';help.style.display='grid'},7000);const box=a.closest('.links');tabs.innerHTML='';if(box){tabs.style.display='flex';box.querySelectorAll('a').forEach(x=>{const b=document.createElement('button');b.textContent=label(x);if(x.href===href)b.className='active';b.onclick=()=>loadRef(x);tabs.appendChild(b)})}}function wire(){try{const doc=atlas.contentDocument;doc.addEventListener('click',e=>{const a=e.target.closest('.links a');if(!a)return;e.preventDefault();e.stopPropagation();loadRef(a)},true)}catch(e){status.textContent='카드 페이지와 뷰어의 출처가 달라 링크 제어를 사용할 수 없습니다.'}}atlas.addEventListener('load',wire);preview.addEventListener('load',()=>{clearTimeout(timer);loader.style.display='none';setTimeout(()=>help.style.display='none',250)});document.getElementById('reloadBtn').onclick=()=>{if(current){help.style.display='none';loader.style.display='block';preview.src=current}};document.getElementById('backBtn').onclick=()=>right.classList.remove('show');</script></body></html>
