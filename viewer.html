<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI/UX Design Style Atlas · Google Split View</title><meta name="description" content="디자인 스타일 카드를 누르면 Google 이미지 검색 결과를 오른쪽 분할화면에 표시하는 뷰어"><style>:root{--bg:#090a0d;--line:#292d36;--text:#f5f6f8;--muted:#9da4b1;--accent:#ff6b35}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100%;display:grid;grid-template-rows:58px 1fr}.topbar{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#0d0f13}.brand{font-weight:800;letter-spacing:-.03em;white-space:nowrap}.status{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.topbar a,.topbar button{border:1px solid var(--line);background:#14171d;color:#fff;border-radius:10px;padding:8px 11px;font-size:12px;text-decoration:none;cursor:pointer}.topbar a:hover,.topbar button:hover{border-color:var(--accent)}.workspace{display:grid;grid-template-columns:minmax(500px,48%) minmax(520px,52%);min-height:0}.panel{min-width:0;min-height:0;position:relative}.left{border-right:1px solid var(--line)}iframe{width:100%;height:100%;border:0;background:#fff}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:40px;background:#111318;color:var(--muted);z-index:2}.empty strong{display:block;color:#fff;font-size:22px;margin-bottom:10px}.mobile-switch{display:none}@media(max-width:900px){.workspace{display:block}.panel{position:absolute;inset:58px 0 0}.right{transform:translateX(100%);transition:.25s ease;z-index:10}.right.show{transform:translateX(0)}.mobile-switch{display:inline-block}.status{display:none}.brand{font-size:13px}}</style></head><body><div class="app"><header class="topbar"><div class="brand">DESIGN ATLAS · GOOGLE VIEW</div><div id="status" class="status">카드를 누르면 오른쪽에 Google 이미지 검색 결과가 표시됩니다.</div><button id="backBtn" class="mobile-switch">카드 보기</button><a id="openBtn" href="https://www.google.com/search?tbm=isch&q=Glassmorphism+UI+design+examples" target="_blank" rel="noopener">Google에서 열기 ↗</a></header><main class="workspace"><section class="panel left"><iframe id="atlas" src="./index.html" title="디자인 스타일 카드"></iframe></section><section id="rightPanel" class="panel right"><div id="empty" class="empty"><div><strong>카드를 선택하세요</strong>왼쪽 디자인 카드를 누르면<br>해당 스타일의 Google 이미지 검색 결과를 표시합니다.</div></div><iframe id="preview" title="Google 이미지 검색 결과" referrerpolicy="no-referrer"></iframe></section></main></div><script>const atlas=document.getElementById('atlas'),preview=document.getElementById('preview'),empty=document.getElementById('empty'),openBtn=document.getElementById('openBtn'),status=document.getElementById('status'),right=document.getElementById('rightPanel');function googleUrl(name){return'https://www.google.com/search?tbm=isch&q='+encodeURIComponent(name+' UI UX design examples app interface')}function openStyle(name){const url=googleUrl(name);empty.style.display='none';preview.src=url;openBtn.href=url;status.textContent=name+' · Google 이미지 검색';right.classList.add('show')}function wire(){try{const doc=atlas.contentDocument;const style=doc.createElement('style');style.textContent='.toggle,.detail,.links{display:none!important}.card{cursor:pointer!important;transition:.18s ease}.card:hover{transform:translateY(-2px);border-color:#ff6b35!important}.card:active{transform:scale(.995)}';doc.head.appendChild(style);doc.addEventListener('click',e=>{const card=e.target.closest('.card');if(!card)return;e.preventDefault();e.stopPropagation();const name=card.querySelector('h2')?.textContent?.trim();if(name)openStyle(name)},true)}catch(e){status.textContent='카드 클릭 제어를 사용할 수 없습니다.'}}atlas.addEventListener('load',wire);document.getElementById('backBtn').onclick=()=>right.classList.remove('show');</script></body></html>
