<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI/UX Design Style Atlas · Figma Search</title><meta name="description" content="디자인 스타일 카드를 누르면 해당 Figma Community 검색 결과를 여는 UI/UX 디자인 참고서"><style>:root{--bg:#090a0d;--line:#292d36;--text:#f5f6f8;--muted:#9da4b1;--accent:#ff6b35}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100%;display:grid;grid-template-rows:58px 1fr}.top{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:#0d0f13}.brand{font-weight:800;letter-spacing:-.03em}.note{flex:1;color:var(--muted);font-size:12px}.top a{color:#fff;text-decoration:none;border:1px solid var(--line);padding:8px 11px;border-radius:10px;font-size:12px}.top a:hover{border-color:var(--accent)}iframe{width:100%;height:100%;border:0;background:var(--bg)}@media(max-width:700px){.note{display:none}.brand{font-size:13px}}</style></head><body><div class="app"><header class="top"><div class="brand">DESIGN ATLAS · FIGMA</div><div class="note">카드 전체를 누르면 해당 스타일의 Figma Community 검색 결과가 새창에서 열립니다.</div><a href="./index.html" target="_blank" rel="noopener">원본 페이지 ↗</a></header><iframe id="atlas" src="./index.html" title="UI/UX 디자인 스타일 카드"></iframe></div><script>const frame=document.getElementById('atlas');frame.addEventListener('load',()=>{const d=frame.contentDocument;if(!d)return;const style=d.createElement('style');style.textContent='.toggle,.links{display:none!important}.detail{display:block!important}.card{cursor:pointer!important;transition:.18s ease!important}.card:hover{transform:translateY(-2px)!important;border-color:#ff6b35!important;background:#191c22!important}.top{pointer-events:none}.bar input{pointer-events:auto}';d.head.appendChild(style);d.querySelectorAll('.card').forEach(card=>{card.classList.remove('open');card.setAttribute('role','link');card.setAttribute('tabindex','0');const title=card.querySelector('h2')?.textContent?.trim()||'';const url='https://www.figma.com/community/search?query='+encodeURIComponent(title+' UI UX');const open=()=>window.open(url,'_blank','noopener,noreferrer');card.addEventListener('click',e=>{if(e.target.closest('input'))return;e.preventDefault();e.stopPropagation();open()},true);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});});</script></body></html>
